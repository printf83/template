<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>template</title>
	</head>
	<body class="print:hidden">
		<div class="main">
			<div class="header">
				<h1 class="text-2xl text-shadow-xs rainbow-animated">
					template
				</h1>
				<div class="btn-group" id="ctlMain">
					<button id="btnPrintAll" class="btn-secondary">
						<i data-icon="printer"></i>
						<span>Print</span>
					</button>
					<button id="btnDownloadPdf" class="btn-secondary">
						<i data-icon="download"></i>
						<span>PDF</span>
					</button>
					<button id="btnEditor" class="btn-primary">
						<i data-icon="settings"></i>
						<span>Setting</span>
					</button>
				</div>
				<div class="btn-group hidden" id="ctlEditor">
					<button id="btnEditorDownload" class="btn-secondary">
						<i data-icon="download"></i>
						<span>Download</span>
					</button>
					<button id="btnEditorSave" class="btn-primary">
						<i data-icon="save"></i>
						<span>Save</span>
					</button>
				</div>
			</div>
			<div class="form-main" id="formMain">
				<iframe id="iframe" class="form-main-frame"></iframe>
			</div>
			<div class="form-editor hidden" id="formEditor">
				<div class="tab-container" id="tabEditor">
					<!-- Tab 1 : Data -->
					<input
						type="radio"
						id="tab-1"
						name="editor-tabs"
						class="tab-radio"
						checked
					/>
					<label for="tab-1" class="tab-btn">
						<i data-icon="database"></i>
						<span>Data</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<div class="form-field">
								<label class="form-label">List</label>
								<ul class="form-list">
									<li>
										<i data-icon="file"></i>
									</li>
									<li>
										<i data-icon="file"></i>
									</li>
									<li>
										<i data-icon="plus"></i>
									</li>
								</ul>
							</div>

							<h2 class="-mb-2">New Data</h2>

							<div class="form-field">
								<label class="form-label"
									>Column 1
									<div class="flex gap-3">
										<div
											class="hover:text-blue-400 cursor-pointer"
										>
											<i
												class="size-3"
												data-icon="download"
											></i>
										</div>
										<div
											class="hover:text-blue-400 cursor-pointer"
										>
											<i
												class="size-3"
												data-icon="upload"
											></i>
										</div>
									</div>
								</label>
								<input type="text" class="form-input" />
							</div>

							<div class="form-field">
								<label class="form-label">Column 2</label>
								<input type="text" class="form-input" />
							</div>

							<div class="form-field">
								<label class="form-label">Column 3</label>
								<input type="text" class="form-input" />
							</div>
						</div>
					</div>

					<!-- Tab 2 : Template -->
					<input
						type="radio"
						id="tab-2"
						name="editor-tabs"
						class="tab-radio"
					/>
					<label for="tab-2" class="tab-btn">
						<i data-icon="file-text"></i>
						<span>Template</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<div class="form-field">
								<label class="form-label">Html</label>
								<textarea
									class="form-textarea field-sizing-content min-h-56! max-h-80 font-mono"
									placeholder='<div class="page a4">{{prop}}</div>'
								></textarea>
							</div>

							<div class="form-field">
								<label class="form-label">Style</label>
								<textarea
									class="form-textarea field-sizing-content max-h-80 font-mono"
									placeholder="body {}"
								></textarea>
							</div>

							<div class="form-field">
								<label class="form-label">Script</label>
								<textarea
									class="form-textarea field-sizing-content max-h-80 font-mono"
									placeholder="const fn = () => {}"
								></textarea>
							</div>
						</div>
					</div>

					<!-- Tab 3 : Asset -->
					<input
						type="radio"
						id="tab-3"
						name="editor-tabs"
						class="tab-radio"
					/>
					<label for="tab-3" class="tab-btn">
						<i data-icon="box"></i>
						<span>Asset</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<div class="form-field">
								<label class="form-label">List</label>
								<ul class="form-list">
									<li>
										<i data-icon="file"></i>
									</li>
									<li>
										<i data-icon="file"></i>
									</li>
									<li>
										<i data-icon="plus"></i>
									</li>
								</ul>
							</div>

							<h2 class="-mb-2">New Asset</h2>

							<div class="form-field">
								<label class="form-label"> Key </label>
								<input type="text" class="form-input" />
							</div>

							<div class="form-field">
								<label class="form-label"
									>Value

									<div class="flex gap-3">
										<div
											class="hover:text-blue-400 cursor-pointer"
										>
											<i
												class="size-3"
												data-icon="download"
											></i>
										</div>
										<div
											class="hover:text-blue-400 cursor-pointer"
										>
											<i
												class="size-3"
												data-icon="upload"
											></i>
										</div>
									</div>
								</label>
								<textarea
									class="form-textarea field-sizing-content max-h-80 font-mono"
								></textarea>
							</div>
						</div>
					</div>

					<!-- Tab 4 : Schema -->
					<input
						type="radio"
						id="tab-4"
						name="editor-tabs"
						class="tab-radio"
					/>
					<label for="tab-4" class="tab-btn">
						<i data-icon="sliders-horizontal"></i>
						<span>Schema</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<div class="form-field">
								<label class="form-label">List</label>
								<ul class="form-list">
									<li>
										<i data-icon="file"></i>
									</li>
									<li>
										<i data-icon="file"></i>
									</li>
									<li>
										<i data-icon="plus"></i>
									</li>
								</ul>
							</div>

							<h2 class="-mb-2">New Schema</h2>

							<div class="form-field">
								<label class="form-label">Key</label>
								<input type="text" class="form-input" />
							</div>

							<div class="form-field">
								<label class="form-label">Type</label>
								<select class="form-select">
									<option value="string">String</option>
									<option value="number">Number</option>
									<option value="boolean">Boolean</option>
									<option value="array">Array</option>
									<option value="object">Object</option>
								</select>
							</div>

							<div class="form-field">
								<label class="form-label">Default</label>
								<input type="text" class="form-input" />
							</div>
						</div>
					</div>

					<!-- Tab 5 : Setting -->
					<input
						type="radio"
						id="tab-5"
						name="editor-tabs"
						class="tab-radio"
					/>
					<label for="tab-5" class="tab-btn">
						<i data-icon="settings"></i>
						<span>Setting</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<div class="form-field">
								<label class="form-label"> Title </label>
								<input type="text" class="form-input" />
							</div>

							<div class="form-field">
								<label class="form-label">Thumbnail</label>
								<input type="file" class="form-file" />
							</div>

							<div class="form-field">
								<label class="form-label">Language</label>
								<select class="form-select">
									<option value="EN">English</option>
									<option value="MY">Bahasa Melayu</option>
								</select>
							</div>

							<h2 class="text-sm -mb-2">Nationality</h2>
							<div class="grid grid-cols-3 gap-2">
								<div class="form-field col-span-1">
									<label class="form-label">Malaysian</label>
									<input
										type="text"
										class="form-input"
										placeholder="Malaysian"
									/>
								</div>
								<div class="form-field col-span-1">
									<label class="form-label"
										>Non-Malaysian</label
									>
									<input
										type="text"
										class="form-input"
										placeholder="Non-Malaysian"
									/>
								</div>
								<div class="form-field col-span-1">
									<label class="form-label">Unknown</label>
									<input
										type="text"
										class="form-input"
										placeholder="Unknown"
									/>
								</div>
							</div>

							<h2 class="text-sm -mb-2">Sex</h2>
							<div class="grid grid-cols-3 gap-2">
								<div class="form-field col-span-1">
									<label class="form-label">Male</label>
									<input
										type="text"
										class="form-input"
										placeholder="Male"
									/>
								</div>
								<div class="form-field col-span-1">
									<label class="form-label">Female</label>
									<input
										type="text"
										class="form-input"
										placeholder="Female"
									/>
								</div>
								<div class="form-field col-span-1">
									<label class="form-label">Unknown</label>
									<input
										type="text"
										class="form-input"
										placeholder="Unknown"
									/>
								</div>
							</div>

							<h2 class="text-sm -mb-2">Short Dictionary</h2>
							<div class="form-field">
								<label class="form-label">List</label>
								<ul class="form-list">
									<li>
										<i data-icon="file"></i>
									</li>
									<li>
										<i data-icon="file"></i>
									</li>
									<li>
										<i data-icon="plus"></i>
									</li>
								</ul>
							</div>

							<div class="grid grid-cols-2 gap-2">
								<div class="form-field col-span-1">
									<label class="form-label">Long</label>
									<input type="text" class="form-input" />
								</div>

								<div class="form-field col-span-1">
									<label class="form-label">Short</label>
									<input type="text" class="form-input" />
								</div>
							</div>
						</div>
					</div>

					<!-- Tab 6 : Test -->
					<input
						type="radio"
						id="tab-6"
						name="editor-tabs"
						class="tab-radio"
					/>
					<label for="tab-6" class="tab-btn">
						<i data-icon="flask-conical"></i>
						<span>Testing</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<!--Input with Label, Hint & Icons (Before & After)-->
							<div class="form-field">
								<label class="form-label">
									Document Title
									<span class="required">*</span>
								</label>

								<div class="input-wrapper">
									<i data-icon="file-text"></i>
									<input
										type="text"
										class="form-input"
										placeholder="e.g. Annual Report 2026"
									/>
									<i data-icon="check-circle"></i>
								</div>

								<span class="form-hint"
									>Used as the header in exports.</span
								>
							</div>

							<!--Joined Input + Button (Search / Action)-->
							<div class="form-field">
								<label class="form-label">Quick Search</label>

								<div class="join">
									<div class="input-wrapper">
										<i data-icon="search"></i>
										<input
											type="text"
											class="form-input"
											placeholder="Search documents..."
										/>
									</div>
									<button type="button" class="btn-primary">
										Search
									</button>
								</div>
							</div>

							<!--Joined Prefix Addon + Input + Suffix Select-->
							<div class="form-field">
								<label class="form-label">Export Margin</label>

								<div class="join">
									<span class="join-addon">Size</span>
									<input
										type="number"
										class="form-input"
										value="15"
									/>
									<select class="form-select w-auto">
										<option>mm</option>
										<option>cm</option>
										<option>in</option>
									</select>
								</div>
							</div>

							<!--Select-->
							<div class="form-field">
								<label class="form-label"
									>Page Orientation</label
								>
								<select class="form-select">
									<option value="a4">A4 Portrait</option>
									<option value="a4-landscape">
										A4 Landscape
									</option>
								</select>
							</div>

							<!--Textarea-->
							<div class="form-field">
								<label class="form-label">Notes</label>
								<textarea
									class="form-textarea"
									placeholder="Add optional notes..."
								></textarea>
							</div>

							<!-- File Input -->
							<div class="form-field">
								<label class="form-label"
									>Attach Cover Image</label
								>
								<input type="file" class="form-file" />
							</div>

							<!-- Checkbox -->
							<label class="form-check">
								<input
									type="checkbox"
									class="form-checkbox"
									checked
								/>
								<span>Compress images during export</span>
							</label>

							<!-- Radio Group -->
							<div class="flex gap-4">
								<label class="form-check">
									<input
										type="radio"
										name="quality"
										class="form-radio"
										checked
									/>
									<span>JPEG (0.95)</span>
								</label>
								<label class="form-check">
									<input
										type="radio"
										name="quality"
										class="form-radio"
									/>
									<span>PNG (Lossless)</span>
								</label>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
