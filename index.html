<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>template</title>
	</head>
	<body class="print:hidden">
		<div class="main">
			<div class="header">
				<h1 class="text-2xl text-shadow-xs rainbow-animated">
					template
				</h1>
				<div class="btn-group" id="ctlMain">
					<button id="btnPrintAll" class="btn-secondary">
						<i data-icon="printer"></i>
						<span>Print</span>
					</button>
					<button id="btnDownloadPdf" class="btn-secondary">
						<i data-icon="download"></i>
						<span>PDF</span>
					</button>
					<button id="btnEditor" class="btn-primary">
						<i data-icon="settings"></i>
						<span>Setting</span>
					</button>
				</div>
				<div class="btn-group hidden" id="ctlEditor">
					<button id="btnEditorDownload" class="btn-secondary">
						<i data-icon="download"></i>
						<span>Download</span>
					</button>
					<button id="btnEditorSave" class="btn-primary">
						<i data-icon="save"></i>
						<span>Save</span>
					</button>
				</div>
			</div>
			<div class="form-main" id="formMain">
				<iframe id="iframe" class="form-main-frame"></iframe>
			</div>
			<div class="form-editor hidden" id="formEditor">
				<div class="tab-container" id="tabEditor">
					<!-- Tab 1 : Data -->
					<input
						type="radio"
						id="tab-1"
						name="editor-tabs"
						class="tab-radio"
						checked
					/>
					<label for="tab-1" class="tab-btn">
						<i data-icon="database"></i>
						<span>Data</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<div
								id="data-editor"
								class="form-code min-h-[calc(100svh-175px)] max-h-[calc(100svh-175px)] flex-1 overflow-hidden text-sm"
							></div>
						</div>
					</div>

					<!-- Tab 2 : Template -->
					<input
						type="radio"
						id="tab-2"
						name="editor-tabs"
						class="tab-radio"
					/>
					<label for="tab-2" class="tab-btn">
						<i data-icon="file-text"></i>
						<span>Template</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<div class="form-field">
								<label class="form-label">Html</label>
								<div
									id="html-editor"
									class="form-code min-h-[calc(100svh-460px)] max-h-[calc(100svh-460px)] flex-1 overflow-hidden text-sm"
								></div>
							</div>

							<div class="form-field">
								<label class="form-label">Style</label>
								<div
									id="style-editor"
									class="form-code min-h-24 max-h-24 flex-1 overflow-hidden text-sm"
								></div>
							</div>

							<div class="form-field">
								<label class="form-label">Script</label>
								<div
									id="script-editor"
									class="form-code min-h-24 max-h-24 flex-1 overflow-hidden text-sm"
								></div>
							</div>
						</div>
					</div>

					<!-- Tab 3 : Asset -->
					<input
						type="radio"
						id="tab-3"
						name="editor-tabs"
						class="tab-radio"
					/>
					<label for="tab-3" class="tab-btn">
						<i data-icon="box"></i>
						<span>Asset</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<div class="form-field">
								<div
									id="asset-editor"
									class="form-code min-h-[calc(100svh-175px)] max-h-[calc(100svh-175px)] flex-1 overflow-hidden text-sm"
								></div>
							</div>
						</div>
					</div>

					<!-- Tab 4 : Schema -->
					<input
						type="radio"
						id="tab-4"
						name="editor-tabs"
						class="tab-radio"
					/>
					<label for="tab-4" class="tab-btn">
						<i data-icon="sliders-horizontal"></i>
						<span>Schema</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<div class="form-field">
								<div
									id="schema-editor"
									class="form-code min-h-[calc(100svh-175px)] max-h-[calc(100svh-175px)] flex-1 overflow-hidden text-sm"
								></div>
							</div>
						</div>
					</div>

					<!-- Tab 5 : Setting -->
					<input
						type="radio"
						id="tab-5"
						name="editor-tabs"
						class="tab-radio"
					/>
					<label for="tab-5" class="tab-btn">
						<i data-icon="settings"></i>
						<span>Setting</span>
					</label>
					<div class="tab-panel">
						<div class="form-container">
							<div class="form-field">
								<label class="form-label"> Title </label>
								<input type="text" class="form-input" />
							</div>

							<div class="form-field">
								<label class="form-label">Thumbnail</label>
								<input
									type="text"
									class="form-input"
									placeholder="data:image/png;base64,"
								/>
							</div>

							<div class="form-field">
								<label class="form-label">Language</label>
								<select class="form-select">
									<option value="EN">English</option>
									<option value="MY">Bahasa Melayu</option>
								</select>
							</div>

							<h2 class="text-sm -mb-2">Nationality</h2>
							<div class="grid grid-cols-3 gap-2">
								<div class="form-field col-span-1">
									<label class="form-label">Malaysian</label>
									<input
										type="text"
										class="form-input"
										placeholder="Malaysian"
									/>
								</div>
								<div class="form-field col-span-1">
									<label class="form-label"
										>Non-Malaysian</label
									>
									<input
										type="text"
										class="form-input"
										placeholder="Non-Malaysian"
									/>
								</div>
								<div class="form-field col-span-1">
									<label class="form-label">Unknown</label>
									<input
										type="text"
										class="form-input"
										placeholder="Unknown"
									/>
								</div>
							</div>

							<h2 class="text-sm -mb-2">Sex</h2>
							<div class="grid grid-cols-3 gap-2">
								<div class="form-field col-span-1">
									<label class="form-label">Male</label>
									<input
										type="text"
										class="form-input"
										placeholder="Male"
									/>
								</div>
								<div class="form-field col-span-1">
									<label class="form-label">Female</label>
									<input
										type="text"
										class="form-input"
										placeholder="Female"
									/>
								</div>
								<div class="form-field col-span-1">
									<label class="form-label">Unknown</label>
									<input
										type="text"
										class="form-input"
										placeholder="Unknown"
									/>
								</div>
							</div>

							<h2 class="text-sm -mb-2">Short Dictionary</h2>
							<div class="form-field">
								<div
									id="short-editor"
									class="form-code min-h-[calc(100svh-605px)] max-h-[calc(100svh-605px)] flex-1 overflow-hidden text-sm"
								></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
