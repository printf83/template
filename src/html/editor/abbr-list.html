<div class="abbr-list-container">
	<div class="flex justify-between items-center">
		<div class="text-sm font-semibold">Abbreviation List</div>
		<div>
			<div class="join">
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnCopyAbbr"
					title="Copy"
				>
					<i data-icon="copy"></i>
					<span class="sr-only">Copy</span>
				</button>
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnPasteAbbr"
					title="Paste"
				>
					<i data-icon="clipboard"></i>
					<span class="sr-only">Paste</span>
				</button>
				<button
					class="btn-secondary btn-sm"
					id="btnAddAbbr"
					title="Add"
				>
					<i data-icon="plus"></i>
					<span class="sr-only">Add</span>
				</button>
			</div>
		</div>
	</div>

	<div class="abbr-list-scrollbar">
		<div
			class="abbr-list max-h-[calc(100svh-637px)] sm:max-h-[calc(100svh-587px)]"
			id="abbrList"
		></div>
	</div>
</div>
