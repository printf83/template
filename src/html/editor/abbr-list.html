<div class="abbr-list-container">
	<div class="flex justify-between items-center">
		<div class="text-sm font-semibold">Abbreviation List</div>
		<div>
			<div class="join shadow-xs">
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnCopyAbbr"
					title="Copy"
				>
					<i data-icon="copy"></i>
					<span class="sr-only">Copy</span>
				</button>
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnPasteAbbr"
					title="Paste"
				>
					<i data-icon="clipboard"></i>
					<span class="sr-only">Paste</span>
				</button>
				<button class="btn-primary btn-sm" id="btnAddAbbr" title="Add">
					<i data-icon="plus"></i>
					<span class="sr-only">Add</span>
				</button>
			</div>
		</div>
	</div>

	<div class="abbr-list-scrollbar max-h-[calc(100svh-570px)]">
		<div class="abbr-list" id="abbrList"></div>
	</div>
</div>
