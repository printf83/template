<div class="mt-4">
	<div class="form-container">
		<div class="form-field">
			<label class="form-label">Key</label>
			<input type="text" class="form-input" id="asset-key" />
		</div>

		<div class="form-field">
			<div class="form-label" data-filename="asset-value">
				<label>Value</label>
				<div>
					<div class="join">
						<button
							class="btn-secondary btn-xs btn-code-download"
							title="Download"
						>
							<i data-icon="download"></i>
							<span class="sr-only">Download</span>
						</button>
						<button
							class="btn-secondary btn-xs btn-code-upload"
							title="Upload"
						>
							<i data-icon="upload"></i>
							<span class="sr-only">Upload</span>
						</button>
					</div>
				</div>
			</div>
			<div id="asset-value" class="form-code h-72"></div>
		</div>
	</div>
</div>
