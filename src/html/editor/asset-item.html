<div class="short-list-item">
	<input
		class="form-input long-editor"
		type="text"
		placeholder="Long Text"
		value="{{key}}"
	/>
	<input
		type="text"
		class="form-input short-editor"
		placeholder="Short Text"
		value="{{value}}"
	/>
	<button class="btn-secondary btn-delete" type="button">
		<i data-icon="trash"></i>
	</button>
</div>
