<div class="asset-list-item">
	<input
		class="form-input asset-key"
		type="text"
		placeholder="Key"
		value="{{key}}"
	/>
	<input
		type="text"
		class="form-input asset-value"
		placeholder="Value"
		value="{{value}}"
	/>
	<button class="btn-secondary btn-delete" type="button">
		<i data-icon="trash"></i>
	</button>
</div>
