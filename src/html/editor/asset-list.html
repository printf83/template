<div class="asset-list-container">
	<div class="flex justify-between items-center p-2">
		<div class="text-sm font-semibold">Asset List</div>
		<div>
			<div class="join">
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnCopyAsset"
					title="Copy"
				>
					<i data-icon="copy"></i>
					<span class="sr-only">Copy</span>
				</button>
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnPasteAsset"
					title="Paste"
				>
					<i data-icon="clipboard"></i>
					<span class="sr-only">Paste</span>
				</button>
				<button
					class="btn-secondary btn-sm"
					id="btnUploadAsset"
					title="Upload"
				>
					<i data-icon="upload"></i>
					<span class="sr-only">Upload</span>
				</button>
				<button class="btn-primary btn-sm" id="btnAddAsset" title="Add">
					<i data-icon="plus"></i>
					<span class="sr-only">Add</span>
				</button>
			</div>
		</div>
	</div>

	<div
		class="asset-list-scrollbar h-[calc(100svh-275px)] sm:h-[calc(100svh-225px)]"
	>
		<div class="asset-list" id="assetList"></div>
	</div>
</div>
