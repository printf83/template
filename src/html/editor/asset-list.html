<div class="asset-list-container">
	<div class="flex justify-between items-center p-3">
		<div class="text-sm font-semibold ps-1">Asset List</div>
		<div>
			<div class="join">
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnCopyAsset"
					title="Copy"
				>
					<i data-icon="copy"></i>
					<span class="sr-only">Copy</span>
				</button>
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnPasteAsset"
					title="Paste"
				>
					<i data-icon="clipboard"></i>
					<span class="sr-only">Paste</span>
				</button>
				<button
					class="btn-secondary btn-sm"
					id="btnUploadAsset"
					title="Open File"
				>
					<i data-icon="folder-open"></i>
					<span class="sr-only">Open File</span>
				</button>
				<button
					class="btn-secondary btn-sm"
					id="btnAddAsset"
					title="Add"
				>
					<i data-icon="plus"></i>
					<span class="sr-only">Add</span>
				</button>
			</div>
		</div>
	</div>

	<div class="asset-list-scrollbar">
		<div class="asset-list" id="assetList"></div>
	</div>
</div>
