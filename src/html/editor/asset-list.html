<div class="asset-list-container">
	<div class="flex justify-between items-center">
		<div class="text-sm font-semibold">Asset Manager</div>
		<div>
			<div class="join shadow-xs">
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnCopyAsset"
					title="Copy"
				>
					<i data-icon="copy"></i>
					<span class="sr-only">Copy</span>
				</button>
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnPasteAsset"
					title="Paste"
				>
					<i data-icon="clipboard"></i>
					<span class="sr-only">Paste</span>
				</button>
				<button class="btn-primary btn-sm" id="btnAddAsset" title="Add">
					<i data-icon="plus"></i>
					<span class="sr-only">Add</span>
				</button>
			</div>
		</div>
	</div>

	<div class="asset-list-scrollbar">
		<div class="asset-list" id="assetList"></div>
	</div>
</div>
