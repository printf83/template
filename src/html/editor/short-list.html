<div class="short-list-container">
	<div class="flex justify-between items-center">
		<div class="text-sm font-semibold">Short Dictionary</div>
		<div>
			<div class="join shadow-xs">
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnEditorCopyShortItem"
					title="Copy"
				>
					<i data-icon="copy"></i>
					<span class="sr-only">Copy</span>
				</button>
				<button
					class="btn-secondary btn-square btn-sm"
					id="btnEditorPasteShortItem"
					title="Paste"
				>
					<i data-icon="clipboard"></i>
					<span class="sr-only">Paste</span>
				</button>
				<button
					class="btn-primary btn-sm"
					id="btnEditorAddShortItem"
					title="Add"
				>
					<i data-icon="plus"></i>
					<span class="sr-only">Add</span>
				</button>
			</div>
		</div>
	</div>

	<div class="short-list-scrollbar">
		<div class="short-list" id="shortDictionaryContainer"></div>
	</div>
</div>
