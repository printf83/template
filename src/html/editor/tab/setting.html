<input type="radio" id="tab-4" name="editor-tabs" class="tab-radio" />
<label for="tab-4" class="tab-btn">
	<i data-icon="settings"></i>
	<span class="hidden sm:inline">Setting</span>
</label>
<div class="tab-panel">
	<div class="form-container">
		<div class="flex flex-row gap-3 justify-center">
			<div class="grow flex flex-col gap-3">
				<div class="form-field">
					<label class="form-label" for="title-editor">Title</label>
					<input type="text" class="form-input" id="title-editor" />
				</div>

				<div class="form-field">
					<label class="form-label" for="lang-editor">Language</label>
					<select class="form-select" id="lang-editor">
						<option value="EN">English</option>
						<option value="MY">Bahasa Melayu</option>
					</select>
				</div>
			</div>
			<div
				class="p-1 border border-zinc-200 dark:border-zinc-800 dark:bg-zinc-900 rounded-lg shadow dark:shadow-zinc-100/10"
			>
				<div
					id="thumb-prev-editor"
					class="w-21.25 h-30.75 rounded-md bg-no-repeat bg-center cursor-pointer"
				>
					<input type="hidden" id="thumb-editor" />
				</div>
			</div>
		</div>

		<div
			class="divider text-sm text-zinc-800 dark:text-zinc-500 -mb-2 mt-1"
		>
			Nationality
		</div>
		<div class="grid grid-cols-3 gap-2">
			<div class="form-field col-span-1">
				<label class="form-label" for="nationality-citizen-editor"
					>Malaysian</label
				>
				<input
					type="text"
					class="form-input"
					id="nationality-citizen-editor"
					placeholder="Malaysian"
				/>
			</div>
			<div class="form-field col-span-1">
				<label class="form-label" for="nationality-noncitizen-editor"
					>Non-Malaysian</label
				>
				<input
					type="text"
					class="form-input"
					id="nationality-noncitizen-editor"
					placeholder="Non-Malaysian"
				/>
			</div>
			<div class="form-field col-span-1">
				<label class="form-label" for="nationality-unknown-editor"
					>Unknown</label
				>
				<input
					type="text"
					class="form-input"
					id="nationality-unknown-editor"
					placeholder="Unknown"
				/>
			</div>
		</div>

		<div
			class="divider text-sm text-zinc-800 dark:text-zinc-500 -mb-2 mt-1"
		>
			Sex
		</div>
		<div class="grid grid-cols-3 gap-2">
			<div class="form-field col-span-1">
				<label class="form-label" for="sex-male-editor">Male</label>
				<input
					type="text"
					class="form-input"
					id="sex-male-editor"
					placeholder="Male"
				/>
			</div>
			<div class="form-field col-span-1">
				<label class="form-label" for="sex-female-editor">Female</label>
				<input
					type="text"
					class="form-input"
					id="sex-female-editor"
					placeholder="Female"
				/>
			</div>
			<div class="form-field col-span-1">
				<label class="form-label" for="sex-unknown-editor"
					>Unknown</label
				>
				<input
					type="text"
					class="form-input"
					id="sex-unknown-editor"
					placeholder="Unknown"
				/>
			</div>
		</div>

		<div class="divider text-sm text-zinc-800 dark:text-zinc-500 mt-1">
			Abbreviation
		</div>

		<div class="form-field">
			<load src="src/html/editor/abbr-list.html" />
		</div>
	</div>
</div>
