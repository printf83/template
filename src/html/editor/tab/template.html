<input type="radio" id="tab-2" name="editor-tabs" class="tab-radio" />
<label for="tab-2" class="tab-btn">
	<i data-icon="file-text"></i>
	<span>Template</span>
</label>
<div class="tab-panel">
	<div class="form-container">
		<div class="form-field">
			<label
				class="form-label"
				data-filename="template"
				data-filetype=".html"
				data-filemime="text/html"
				><span>Html</span>
				<load src="src/html/editor/form-code-control.html"
			/></label>
			<div
				id="html-editor"
				class="form-code h-[calc(100svh-545px)]"
			></div>
		</div>

		<div class="form-field">
			<label
				class="form-label"
				data-filename="style"
				data-filetype=".css"
				data-filemime="text/css"
				><span>Style</span>
				<load src="src/html/editor/form-code-control.html"
			/></label>
			<div id="style-editor" class="form-code h-32"></div>
		</div>

		<div class="form-field">
			<label
				class="form-label"
				data-filename="script"
				data-filetype=".js"
				data-filemime="text/javascript"
				><span>Script</span>
				<load src="src/html/editor/form-code-control.html"
			/></label>
			<div id="script-editor" class="form-code h-32"></div>
		</div>
	</div>
</div>
