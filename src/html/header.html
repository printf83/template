<h1 class="text-2xl font-semibold text-shadow-xs rainbow-animated">template</h1>
<div class="btn-group" id="ctlMain">
	<button
		id="btnUserKey"
		class="btn-secondary"
		title="Private & Encrypted Storage "
	>
		<i data-icon="ShieldLock"></i>
		<span id="btnUserKeyName">...</span>
	</button>

	<div class="join">
		<button
			id="btnFaq"
			class="btn-secondary btn-square"
			title="Frequently Asked Questions"
		>
			<i data-icon="circle-question-mark"></i>
			<span class="sr-only">Frequently Asked Questions</span>
		</button>
		<button id="btnPrintAll" class="btn-secondary btn-square" title="Print">
			<i data-icon="printer"></i>
			<span class="sr-only">Print</span>
		</button>
		<button
			id="btnDownloadPdf"
			class="btn-secondary btn-square"
			title="Download PDF"
		>
			<i data-icon="download"></i>
			<span class="sr-only">PDF</span>
		</button>
	</div>
	<button id="btnEditor" class="btn-primary">
		<i data-icon="settings"></i>
		<span>Setting</span>
	</button>
</div>
<div class="btn-group hidden" id="ctlEditor">
	<button id="btnEditorNew" class="btn-secondary">
		<i data-icon="sparkles"></i>
		<span>New</span>
	</button>
	<div class="join">
		<button
			id="btnEditorReadFile"
			class="btn-secondary btn-square"
			title="Read File"
		>
			<i data-icon="clipboard-copy"></i>
			<span class="sr-only">Read File</span>
		</button>
		<button
			id="btnEditorUploadFile"
			class="btn-secondary btn-square"
			title="Upload"
		>
			<i data-icon="upload"></i>
			<span class="sr-only">Upload</span>
		</button>
		<button
			id="btnEditorDownloadFile"
			class="btn-secondary btn-square"
			title="Download"
		>
			<i data-icon="download"></i>
			<span class="sr-only">Download</span>
		</button>
		<button
			id="btnEditorCancel"
			class="btn-secondary btn-square"
			title="Cancel"
		>
			<i data-icon="undo2"></i>
			<span class="sr-only">Cancel</span>
		</button>
	</div>
	<button id="btnEditorSave" class="btn-primary">
		<i data-icon="save"></i>
		<span>Save</span>
	</button>
</div>
