<div id="loading" class="spinner-container">
	<style>
		.spinner-container {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #ffffff;
			z-index: 9999;
			transition:
				opacity 0.3s ease,
				visibility 0.3s ease;
		}

		.spinner {
			box-sizing: border-box;
			width: 48px;
			height: 48px;
			border: 4px solid #f3f3f3;
			border-top: 4px solid #000;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}
			100% {
				transform: rotate(360deg);
			}
		}

		/* 1. Support system preference dark mode */
		@media (prefers-color-scheme: dark) {
			.spinner-container {
				background-color: #18181b; /* Tailwind zinc-900 */
			}
			.spinner {
				border: 4px solid #27272a; /* Tailwind zinc-800 */
				border-top: 4px solid #ffffff;
			}
		}

		/* 2. Support class-based dark mode (.dark on html or body) */
		html.dark .spinner-container,
		body.dark .spinner-container,
		.dark .spinner-container {
			background-color: #18181b;
		}
		html.dark .spinner,
		body.dark .spinner,
		.dark .spinner {
			border: 4px solid #27272a;
			border-top: 4px solid #ffffff;
		}
	</style>
	<div class="spinner"></div>
</div>
