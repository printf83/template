<div class="space-y-4 pt-4">
	<!-- Simple Trust Notice -->
	<div
		class="rounded-lg bg-emerald-50 p-3 text-xs text-emerald-900 border border-emerald-200"
	>
		<h4
			class="font-semibold text-sm mb-1 flex items-center gap-1.5 text-emerald-700"
		>
			<i data-icon="shield-check"></i>
			Private & Encrypted Storage
		</h4>
		<p class="leading-relaxed">
			Your data is encrypted directly on your device using your password.
			Nothing is stored unencrypted.
		</p>
	</div>

	<!-- Passphrase Input -->
	<div class="form-container">
		<label
			for="user-key"
			class="block text-xs font-medium text-gray-700 mb-1"
		>
			Enter Access Key or Password
		</label>
		<div class="form-field">
			<input
				type="password"
				class="form-input w-full px-3 py-2 border rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
				placeholder="Enter key..."
				id="user-key"
				autocomplete="off"
			/>
		</div>
	</div>

	<!-- Brief Note -->
	<p class="text-xs text-gray-500">
		Entering a different key will switch to a separate encrypted workspace.
	</p>
</div>
